name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
          for f in lib/*.js web/*.js dev/*.js; do
            node --check "$f"
          done

      - name: 插件能加载（假 ctx 跑一遍 apply）
        run: node dev/apply-test.js

      - name: 断盘保护（只读 / 不覆盖 / 恢复）
        run: node dev/test-storage-guard.mjs

      - name: 换文件夹不搬数据
        run: node dev/test-switch-folder.mjs
